name: Odyssey Seat Check

on:
  schedule:
    # Every 20 minutes. GitHub may delay this slightly during high load.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run seat check
        env:
          NTFY_TOPIC: odyssey-hunt
        run: python check_seats.py

      - name: Commit updated state
        run: |
          git config user.name "odyssey-hunt-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update showtime state [skip ci]"
          git push
